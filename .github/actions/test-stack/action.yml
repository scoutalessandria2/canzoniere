name: Test stack
description: Type-check and build the web apps, run the editor and reader E2E tests, test the rhythm engine's pure parts, test the backend, build the printer tool.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.24'
        cache-dependency-path: printer/go.sum

    - name: Install editor dependencies
      shell: bash
      run: cd editor && npm ci

    - name: Check editor
      shell: bash
      run: cd editor && npm run check

    - name: Install Playwright browsers
      shell: bash
      run: cd editor && npx playwright install --with-deps chromium

    - name: Run editor E2E tests
      shell: bash
      run: cd editor && npm test

    - name: Build editor (online mode)
      shell: bash
      env:
        BASE_PATH: /editor
        VITE_ONLINE: '1'
      run: cd editor && npm run build

    - name: Install reader dependencies
      shell: bash
      run: cd reader && npm ci

    - name: Check reader
      shell: bash
      run: cd reader && npm run check

    - name: Install reader Playwright browsers
      shell: bash
      run: cd reader && npx playwright install --with-deps chromium

    - name: Run reader E2E tests
      shell: bash
      run: cd reader && npm test

    - name: Build reader
      shell: bash
      env:
        BASE_PATH: /app
      run: cd reader && npm run build

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Test rhythm engine (pure parts)
      shell: bash
      run: pip install -r rhythm/requirements-test.txt && python -m pytest rhythm/tests -q

    - name: Vet backend
      shell: bash
      run: cd backend && go vet ./...

    - name: Test backend
      shell: bash
      run: cd backend && go test ./...

    - name: Build backend
      shell: bash
      run: cd backend && go build -o /dev/null .

    - name: Vet printer
      shell: bash
      run: cd printer && go vet ./...

    - name: Build printer
      shell: bash
      run: cd printer && go build -o printer .

    - name: Build event songbooks
      shell: bash
      run: |
        shopt -s nullglob
        for txt in canzonieri/*.txt; do
          ./printer/printer \
            -input="$txt" \
            -output="$(mktemp -t canzoniere.XXXXXX).pdf" \
            -songs=canzoni \
            -dedup-chorus
        done
